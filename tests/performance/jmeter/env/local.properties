# ─── JMeter properties — LOCAL environment ─────────────────────────────────────
# Pass to JMeter with: jmeter -n -t plans/01-baseline-smoke.jmx -p env/local.properties
#
# Override any property with -Jproperty=value on the command line.
# Example: jmeter -n -t plans/01-baseline-smoke.jmx -p env/local.properties -Jthreads=20

# Target server
protocol=http
host=localhost
port=4321

# Test listing IDs that exist in your local Supabase dev DB
listing_id=00000000-0000-0000-0000-000000000001
listing_slug=villa-thalassa

# Thread group sizing (keep small for local)
threads=5
ramp_time=10
duration=60

# Results directory
results_dir=results/local
